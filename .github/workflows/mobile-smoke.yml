name: Mobile usability checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium webkit
      - name: Run mobile and desktop acceptance
        run: |
          python -m http.server 4173 --bind 127.0.0.1 > /tmp/app-server.log 2>&1 &
          node tests/mobile-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-screenshots
          path: test-artifacts/
          retention-days: 7
