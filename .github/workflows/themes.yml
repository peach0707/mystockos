name: Update themes

on:
  workflow_dispatch:
  schedule:
    - cron: "30 23 * * 1-5"

permissions:
  contents: write

jobs:
  update-themes:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas requests

      - name: Validate Theme System config
        run: python config/validate_theme_config.py

      - name: Calculate Theme System v1.0
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: python scripts/update_themes.py

      - name: Commit updated theme data
        run: |
          if [ -z "$(git status --porcelain -- data/themes.json data/theme_history.jsonl)" ]; then
            echo "No theme data changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/themes.json data/theme_history.jsonl
          git commit -m "Update theme data"
          git push
