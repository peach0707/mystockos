name: Phase A display metrics
on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * 2-6'
permissions:
  contents: read
concurrency:
  group: phase-a-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_display_metrics.py' -v
      - run: python -m unittest discover -s tests -p 'test_publish_display_metrics.py' -v
      - run: python tests/check_frozen.py
  collect:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install exchange_calendars==4.11.3 pandas==2.2.3 numpy==2.2.6
      - run: python scripts/collect_display_metrics.py
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
      - name: Save only display and observation artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python scripts/publish_display_metrics.py